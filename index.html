<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>筆文字メーカー｜無料で筆文字の画像が作れる</title>
<meta name="description" content="文字を入れるだけで、筆で書いたような画像が作れる無料ツール。縦書き・落款・和紙背景つき。スマホでも使えます。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Yuji+Syuku&family=Yuji+Mai&family=New+Tegomin&family=Shippori+Mincho:wght@500;800&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  :root { --ink:#2b2622; --paper:#f6f1e6; --accent:#a8322d; --line:#d9cfbd; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Shippori Mincho", serif; line-height:1.7; }
  header { text-align:center; padding:28px 16px 8px; }
  header h1 { font-family:"Yuji Syuku", serif; font-size:2.4rem; margin:0; letter-spacing:.1em; }
  header p { margin:4px 0 0; font-size:1rem; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns: 360px 1fr; gap:24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .panel { background:#fffdf8; border:1px solid var(--line); border-radius:12px; padding:18px; }
  label { display:block; font-weight:500; margin:14px 0 6px; font-size:1.05rem; }
  label:first-child { margin-top:0; }
  textarea, select, input[type=text] { width:100%; font-size:1.1rem; padding:10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; background:#fff; }
  textarea { height:96px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { flex:1; min-width:70px; }
  .chip input { display:none; }
  .chip span { display:block; text-align:center; padding:9px 4px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:#fff; font-size:1rem; }
  .chip input:checked + span { background:var(--ink); color:#fff; border-color:var(--ink); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .preview { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .preview .stage { width:100%; display:flex; justify-content:center; background:repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 50%/20px 20px; border-radius:12px; padding:12px; border:1px solid var(--line); }
  #out { max-width:100%; max-height:70vh; box-shadow:0 4px 18px rgba(0,0,0,.15); }
  button { font-family:inherit; font-size:1.15rem; padding:12px 28px; border:none; border-radius:999px; background:var(--accent); color:#fff; cursor:pointer; }
  .hint { font-size:.92rem; color:#6b6157; text-align:center; margin:0; }
  .promo { max-width:1100px; margin:8px auto 40px; padding:0 16px; }
  .promo .box { background:#fff; border:2px solid var(--accent); border-radius:14px; padding:20px 22px; text-align:center; }
  .promo h2 { margin:0 0 6px; font-size:1.3rem; }
  .promo p { margin:6px 0; }
  .promo a { display:inline-block; margin-top:10px; color:#fff; background:var(--ink); padding:10px 24px; border-radius:999px; text-decoration:none; }
  footer { text-align:center; font-size:.85rem; color:#7a7064; padding:0 16px 30px; }
</style>
</head>
<body>
<header>
  <h1>筆文字メーカー</h1>
  <p>文字を入れるだけで、筆で書いたような画像ができます（無料）</p>
</header>

<main>
  <section class="panel">
    <label for="text">書きたい言葉（改行すると次の行になります）</label>
    <textarea id="text">一期一会</textarea>

    <label>書く向き</label>
    <div class="row">
      <label class="chip"><input type="radio" name="dir" value="v" checked><span>縦書き</span></label>
      <label class="chip"><input type="radio" name="dir" value="h"><span>横書き</span></label>
    </div>

    <label>紙の形</label>
    <div class="row">
      <label class="chip"><input type="radio" name="paper" value="tall" checked><span>縦長</span></label>
      <label class="chip"><input type="radio" name="paper" value="square"><span>正方形</span></label>
      <label class="chip"><input type="radio" name="paper" value="wide"><span>横長</span></label>
    </div>

    <label for="font">書体</label>
    <select id="font">
      <option value="Yuji Boku">墨（太くて力強い）</option>
      <option value="Yuji Syuku">肅（きちんとした楷書）</option>
      <option value="Yuji Mai">舞（やわらかい行書）</option>
      <option value="New Tegomin">手書き風</option>
      <option value="Shippori Mincho">明朝</option>
      <option value="Zen Kurenaido">ペン字風</option>
    </select>

    <label>墨の色</label>
    <div class="row">
      <label class="chip"><input type="radio" name="ink" value="sumi" checked><span>墨</span></label>
      <label class="chip"><input type="radio" name="ink" value="usuzumi"><span>薄墨</span></label>
      <label class="chip"><input type="radio" name="ink" value="shu"><span>朱</span></label>
      <label class="chip"><input type="radio" name="ink" value="ai"><span>藍</span></label>
      <label class="chip"><input type="radio" name="ink" value="kin"><span>金</span></label>
    </div>

    <label for="kasure">かすれ</label>
    <input type="range" id="kasure" min="0" max="100" value="35">
    <label for="nijimi">にじみ</label>
    <input type="range" id="nijimi" min="0" max="100" value="25">
    <label for="size">文字の大きさ</label>
    <input type="range" id="size" min="50" max="120" value="100">

    <label>背景</label>
    <div class="row">
      <label class="chip"><input type="radio" name="bg" value="washi" checked><span>和紙</span></label>
      <label class="chip"><input type="radio" name="bg" value="white"><span>白</span></label>
      <label class="chip"><input type="radio" name="bg" value="none"><span>透明</span></label>
    </div>

    <label for="seal">落款（ハンコ・4文字まで。空なら押しません）</label>
    <input type="text" id="seal" maxlength="4" value="響">
    <div class="row" style="margin-top:8px">
      <label class="chip"><input type="radio" name="sealType" value="haku" checked><span>白文（赤地に白字）</span></label>
      <label class="chip"><input type="radio" name="sealType" value="shu"><span>朱文（赤い字）</span></label>
    </div>
  </section>

  <section class="preview">
    <div class="stage"><img id="out" alt="できあがった筆文字の画像"></div>
    <button id="save">画像を保存する</button>
    <p class="hint">スマホの方は、画像を長押しして「写真に保存」でも保存できます</p>
  </section>
</main>

<section class="promo">
  <div class="box">
    <h2>このアプリは、AIとおしゃべりして作りました</h2>
    <p>作ったのは、60代のAI講師「みやん」です。プログラムは書いていません。</p>
    <p>「こんなものがほしい」とAIに話すだけで、自分専用のアプリが作れます。<br>やり方を、初めての方にもわかるようにお伝えしています。</p>
    <a href="https://hibiki-no-ie.com/" target="_blank" rel="noopener">響の家のAI講座を見てみる</a>
  </div>
</section>

<footer>© 合同会社響の家 ／ 作成した画像はご自由にお使いください</footer>

<canvas id="cv" style="display:none"></canvas>

<script>
const $ = (s) => document.querySelector(s);
const val = (name) => document.querySelector(`input[name="${name}"]:checked`).value;
const cv = $('#cv'), ctx = cv.getContext('2d');

const PAPER = { tall:[1200,1700], square:[1500,1500], wide:[1700,1200] };
const INK = { sumi:'#141210', usuzumi:'#5d5955', shu:'#b8302a', ai:'#1d3461' };
const ROTATE = 'ー－〜～…‥─—=＝-（）()「」『』【】〔〕［］[]｛｝{}〈〉《》<>';
const SMALL = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ';
const PUNCT = '、。，．';

// 乱数を固定して、同じ設定なら同じ仕上がりにする
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s){ let h = 2166136261; for (const c of s) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return h; }

function drawWashi(c, w, h, r){
  c.fillStyle = '#f3ecdc'; c.fillRect(0,0,w,h);
  const g = c.createRadialGradient(w/2,h/2,Math.min(w,h)*0.2,w/2,h/2,Math.max(w,h)*0.75);
  g.addColorStop(0,'rgba(255,252,242,0.6)'); g.addColorStop(1,'rgba(200,180,140,0.25)');
  c.fillStyle = g; c.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){ // 繊維
    const x=r()*w, y=r()*h, len=8+r()*40, a=r()*Math.PI*2;
    c.strokeStyle = r()<0.5 ? `rgba(255,255,250,${0.25+r()*0.35})` : `rgba(160,140,105,${0.06+r()*0.12})`;
    c.lineWidth = 0.6+r()*1.2;
    c.beginPath(); c.moveTo(x,y);
    c.quadraticCurveTo(x+Math.cos(a+0.6)*len/2, y+Math.sin(a+0.6)*len/2, x+Math.cos(a)*len, y+Math.sin(a)*len);
    c.stroke();
  }
  for (let i=0;i<500;i++){ c.fillStyle=`rgba(120,100,70,${r()*0.12})`; c.fillRect(r()*w,r()*h,1+r()*2,1+r()*2); }
}

function layout(lines, dir, w, h, scale){
  const cols = Math.max(1, lines.length);
  const rows = Math.max(1, ...lines.map(l => [...l].length));
  const margin = 0.12;
  const aw = w*(1-margin*2), ah = h*(1-margin*2);
  let fs;
  if (dir === 'v') fs = Math.min(ah/rows, aw/(cols*1.25));
  else fs = Math.min(aw/rows, ah/(cols*1.3));
  return { fs: fs*scale/100, cols, rows };
}

function renderText(c, lines, dir, w, h, fs, font){
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = `${fs}px "${font}"`;
  const pos = [];
  if (dir === 'v'){
    const gap = fs*1.25, total = gap*(lines.length-1);
    lines.forEach((line, i) => {
      const x = w/2 + total/2 - i*gap;
      const chars = [...line], len = chars.length*fs;
      chars.forEach((ch, j) => {
        let y = h/2 - len/2 + fs*(j+0.5);
        c.save(); c.translate(x, y);
        if (ROTATE.includes(ch)) c.rotate(Math.PI/2);
        if (SMALL.includes(ch)) c.translate(fs*0.12, -fs*0.12);
        if (PUNCT.includes(ch)) c.translate(fs*0.55, -fs*0.55);
        c.fillText(ch, 0, 0); c.restore();
      });
      pos.push({ x, yEnd: h/2 + len/2 });
    });
  } else {
    const gap = fs*1.3, total = gap*(lines.length-1);
    lines.forEach((line, i) => {
      const y = h/2 - total/2 + i*gap;
      c.fillText(line, w/2, y);
      pos.push({ y, xEnd: w/2 + c.measureText(line).width/2 });
    });
  }
  return pos;
}

function drawSeal(c, text, type, cx, cy, size, r){
  const red = '#b52a22';
  const chars = [...text];
  // 位置：右の列から上→下の順（伝統的な読み順）
  let cells;
  if (chars.length === 1) cells = [[0.5,0.5,1,1]];
  else if (chars.length === 2) cells = [[0.5,0.27,1,0.5],[0.5,0.73,1,0.5]];
  else if (chars.length === 3) cells = [[0.73,0.5,0.5,1],[0.27,0.27,0.5,0.5],[0.27,0.73,0.5,0.5]];
  else cells = [[0.73,0.27,0.5,0.5],[0.73,0.73,0.5,0.5],[0.27,0.27,0.5,0.5],[0.27,0.73,0.5,0.5]];
  const x0 = cx-size/2, y0 = cy-size/2;
  const off = document.createElement('canvas'); off.width = off.height = Math.ceil(size);
  const o = off.getContext('2d');
  if (type === 'haku'){ o.fillStyle = red; o.fillRect(0,0,size,size); o.globalCompositeOperation = 'destination-out'; }
  else { o.strokeStyle = red; o.lineWidth = size*0.07; o.strokeRect(size*0.05,size*0.05,size*0.9,size*0.9); o.fillStyle = red; }
  o.textAlign='center'; o.textBaseline='middle';
  chars.forEach((ch,i)=>{
    const [px,py,cw,chh] = cells[i];
    const fs = Math.min(cw,chh)*size*0.78;
    o.save(); o.translate(px*size, py*size);
    o.scale(cw*size*0.82/fs, chh*size*0.82/fs);
    o.font = `800 ${fs}px "Shippori Mincho"`;
    o.fillText(ch,0,fs*0.04); o.restore();
  });
  // 印のかすれ
  o.globalCompositeOperation = 'destination-out';
  for (let i=0;i<220;i++){ o.fillStyle=`rgba(0,0,0,${0.3+r()*0.7})`; o.beginPath(); o.arc(r()*size,r()*size,0.5+r()*size*0.018,0,Math.PI*2); o.fill(); }
  c.save(); c.globalAlpha = 0.92; c.drawImage(off, x0, y0); c.restore();
}

function inkFill(c, ink, w, h){
  if (ink === 'kin'){
    const g = c.createLinearGradient(0,0,w,h);
    g.addColorStop(0,'#8a6a1f'); g.addColorStop(0.35,'#e9c96a'); g.addColorStop(0.55,'#b88b2a'); g.addColorStop(0.8,'#f3dc8c'); g.addColorStop(1,'#8a6a1f');
    return g;
  }
  return INK[ink];
}

async function render(){
  const text = $('#text').value.replace(/\r/g,'').trim() || ' ';
  const lines = text.split('\n').map(s => s.trim()).filter((s,i,a) => s || a.length===1);
  const dir = val('dir'), ink = val('ink'), bg = val('bg'), sealType = val('sealType');
  const font = $('#font').value;
  const kasure = +$('#kasure').value/100, nijimi = +$('#nijimi').value/100, scale = +$('#size').value;
  const seal = $('#seal').value.trim();
  const [w,h] = PAPER[val('paper')];
  cv.width = w; cv.height = h;
  const r = rng(hash(text + font + dir + w));

  try { await document.fonts.load(`80px "${font}"`, text); await document.fonts.load(`800 80px "Shippori Mincho"`, seal || '響'); } catch(e) {}

  ctx.clearRect(0,0,w,h);
  if (bg === 'washi') drawWashi(ctx, w, h, r);
  else if (bg === 'white') { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h); }

  const { fs } = layout(lines, dir, w, h, scale);

  // 文字だけを別の紙に書いて、かすれ・にじみを加える
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const tc = t.getContext('2d');
  tc.fillStyle = inkFill(tc, ink, w, h);
  const pos = renderText(tc, lines, dir, w, h, fs, font);

  if (kasure > 0){
    tc.globalCompositeOperation = 'destination-out';
    const angle = dir === 'v' ? Math.PI/2 : 0;
    const n = Math.floor(300 + kasure*2200);
    for (let i=0;i<n;i++){
      const x = r()*w, y = r()*h, len = fs*(0.15+r()*0.9)*kasure;
      const a = angle + (r()-0.5)*0.5;
      tc.strokeStyle = `rgba(0,0,0,${0.25+r()*0.75*kasure})`;
      tc.lineWidth = 0.6 + r()*fs*0.018;
      tc.beginPath(); tc.moveTo(x,y); tc.lineTo(x+Math.cos(a)*len, y+Math.sin(a)*len); tc.stroke();
    }
    tc.globalCompositeOperation = 'source-over';
  }

  if (nijimi > 0){
    ctx.save();
    ctx.filter = `blur(${2 + nijimi*fs*0.05}px)`;
    ctx.globalAlpha = 0.25 + nijimi*0.35;
    ctx.drawImage(t, 0, 0);
    ctx.restore();
  }
  ctx.drawImage(t, 0, 0);
  if (ink === 'usuzumi') { ctx.save(); ctx.globalAlpha = 0.25; ctx.drawImage(t, 1.5, 1); ctx.restore(); }

  if (seal){
    const ss = Math.max(70, Math.min(fs*0.62, Math.min(w,h)*0.14));
    let sx, sy;
    if (dir === 'v'){
      const last = pos[pos.length-1];
      sx = Math.max(ss*0.8, last.x - fs*1.05);
      sy = Math.min(h - ss*0.8, last.yEnd - ss/2);
    } else {
      const last = pos[pos.length-1];
      sx = Math.min(w - ss*0.8, last.xEnd + ss*0.75);
      sy = Math.min(h - ss*0.8, last.y + fs*0.9);
    }
    drawSeal(ctx, seal, sealType, sx, sy, ss, r);
  }

  $('#out').src = cv.toDataURL('image/png');
}

let timer;
function schedule(){ clearTimeout(timer); timer = setTimeout(render, 150); }
document.querySelectorAll('input, select, textarea').forEach(el => { el.addEventListener('input', schedule); el.addEventListener('change', schedule); });

$('#save').addEventListener('click', () => {
  const a = document.createElement('a');
  const name = ($('#text').value.trim().split('\n')[0] || 'fudemoji').slice(0, 10);
  a.download = `筆文字_${name}.png`;
  a.href = cv.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
});

document.fonts.ready.then(render);
render();
</script>
</body>
</html>
